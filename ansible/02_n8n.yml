---
# ============================================================
# Sentinel Codex — Playbook 02 — n8n credential + workflows
# ============================================================
# Purpose:    1. imports the module's Postgres credential into Cyber
#                Sentinel's n8n with a fixed id (upsert — re-runs refresh
#                the password)
#             2. imports the News Radar workflow once; if a workflow with
#                that id exists it is left alone, so edits made in n8n are
#                never overwritten. Imported inactive — activate in n8n.
#
# Depends on: - 01 (database + roles)
#             - Cyber Sentinel n8n with credentials "HashiCorp Vault
#               account", "Google Gemini(PaLM) Api account" and "SMTP
#               account" (Cyber Sentinel playbook 06.2) — the workflow
#               reuses them by id
# ============================================================

- name: 02 - n8n credential and workflows
  hosts: all_servers
  become: yes

  vars:
    n8n: "{{ platform_n8n_container }}"
    news_credentials:
      - id: "{{ news_n8n_credential_id }}"
        name: "{{ news_n8n_credential_name }}"
        type: "postgres"
        data:
          host: "{{ platform_postgres_container }}"
          port: 5432
          database: "{{ codex_db_name }}"
          user: "{{ news_n8n_db_user }}"
          password: "{{ vault_news_n8n_db_password }}"
          ssl: "disable"

  tasks:
    - name: "[02.0.1] Verify Cyber Sentinel n8n is running"
      ansible.builtin.command:
        cmd: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ n8n }}"
      register: codex_n8n_running
      changed_when: false
      failed_when: codex_n8n_running.rc != 0 or codex_n8n_running.stdout | trim != 'true'

    # ============================================================
    # SECTION 1 — Credential (same pattern as Cyber Sentinel 06.2)
    # ============================================================

    - name: "[02.1.X] Import module news Postgres credential"
      block:
        - name: "[02.1.1] Stage credential file on host (plaintext secret)"
          ansible.builtin.copy:
            content: "{{ news_credentials | to_json }}"
            dest: "/tmp/codex_credentials.json"
            mode: '0600'
          no_log: true

        - name: "[02.1.2] Copy credential file into n8n container"
          ansible.builtin.shell:
            cmd: >-
              docker exec -i -u node {{ n8n }}
              sh -c 'umask 077 && cat > /tmp/codex_credentials.json'
              < /tmp/codex_credentials.json
          no_log: true

        - name: "[02.1.3] Import credential via n8n CLI"
          ansible.builtin.command:
            cmd: "docker exec -u node {{ n8n }} n8n import:credentials --input=/tmp/codex_credentials.json"
          register: codex_cred_import
          changed_when: "'Successfully imported' in codex_cred_import.stdout"
          no_log: true

      always:
        - name: "[02.1.4] Remove plaintext credential file (host + container)"
          ansible.builtin.shell:
            cmd: >-
              rm -f /tmp/codex_credentials.json;
              docker exec -u root {{ n8n }} rm -f /tmp/codex_credentials.json
          changed_when: false

    # ============================================================
    # SECTION 2 — Workflow (imported once)
    # ============================================================

    - name: "[02.2.1] Check whether News Radar is already in n8n"
      ansible.builtin.command:
        cmd: "docker exec -u node {{ n8n }} n8n export:workflow --id={{ news_workflow_id }} --output=/tmp/codex_wf_exists.json"
      register: codex_wf_exists
      changed_when: false
      failed_when: false

    - name: "[02.2.X] Import News Radar"
      when: codex_wf_exists.rc != 0
      block:
        - name: "[02.2.2] Stage workflow JSON on the server"
          ansible.builtin.copy:
            src: "{{ codex_repo_dir }}/modules/news/n8n/{{ news_workflow_file }}"
            dest: "/tmp/codex_news_radar.json"
            mode: '0644'

        - name: "[02.2.3] Copy workflow JSON into n8n container"
          ansible.builtin.command:
            cmd: "docker cp /tmp/codex_news_radar.json {{ n8n }}:/tmp/codex_news_radar.json"

        - name: "[02.2.4] Import workflow via n8n CLI"
          ansible.builtin.command:
            cmd: "docker exec -u node {{ n8n }} n8n import:workflow --input=/tmp/codex_news_radar.json"
          register: codex_wf_import
          failed_when: codex_wf_import.rc != 0 or 'Successfully imported' not in (codex_wf_import.stdout + codex_wf_import.stderr)

      always:
        - name: "[02.2.5] Remove staged workflow JSON"
          ansible.builtin.shell:
            cmd: >-
              rm -f /tmp/codex_news_radar.json;
              docker exec -u root {{ n8n }} rm -f /tmp/codex_news_radar.json /tmp/codex_wf_exists.json
          changed_when: false

    - name: "[02.2.6] Summary"
      ansible.builtin.debug:
        msg: "News Radar workflow: {{ 'imported now' if codex_wf_exists.rc != 0 else 'already in n8n, left unchanged' }} — activate it in n8n."
