# ============================================================
# Sentinel Codex — Ansible configuration
# ============================================================
# Picked up when ansible-playbook runs from this directory.
# Relative paths below are resolved against this file's directory.
# ============================================================

[defaults]
inventory = hosts.ini
host_key_checking = False
interpreter_python = auto_silent

# Own vault password file (git-ignored). Secrets: group_vars/all/vault.yml,
# see vault.yml.example for the list.
vault_password_file = .vault_pass
